name: Release new version
description: Release python project on pypi and github

inputs:
  pre-release-tag:
    description: 'Tag for pre-release'
    default: ''
    required: true
  major-release:
    description: 'Trigger a major release. Leave empty for regular release.'
    default: ''
    required: true
  pypi-username:
    description: 'Pypi username for deployment'
    required: true
  pypi-password:
    description: 'Pypi password for deployment'
    required: true
  version-file-path:
    description: 'Path to the file containing __version__ = '
    required: true
  main-branch:
    description: 'Name of the main branch in the repo'
    default: 'main'
    required: false
  version-override:
    description: 'Override automatic version generation'
    required: false
    
runs:
  using: "composite"
  steps:
    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
      shell: bash
        
    - name: Setup git config
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
      shell: bash

    - name: Get changes since last release
      id: get_changes
      if: inputs.version-override == ''
      run: |
        OLD_TAG=$(git describe --tags --abbrev=0)
        echo "Old tag was ${OLD_TAG}"
        CHANGE_LOG=$(git log "$OLD_TAG"..HEAD --pretty=format:%s | sed 's/"/\\"/g')
        {
          echo "changes<<EOF"
          echo "$CHANGE_LOG"
          echo "EOF"
          echo "old_tag=$OLD_TAG"
        } >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Generate new version tag
      id: tag_generation
      if: inputs.version-override == ''
      uses: firebolt-db/action-generate-version@1021b71726a3077b3887f1b15925be3196c7bc3b # v1.1.0
      with:
        changes: ${{ steps.get_changes.outputs.changes }}
        old-tag: ${{ steps.get_changes.outputs.old_tag }}
        prerelease-tag: ${{ inputs.pre-release-tag }}
        major-release: ${{ inputs.major-release }}

    - name: Use overridden tag if supplied
      id: tag_resolution
      run: |
        TAG="${GENERATED_TAG}${VERSION_OVERRIDE}"
        echo "new_tag=${TAG}" >> "${GITHUB_OUTPUT}"
      env:
        GENERATED_TAG: ${{ steps.tag_generation.outputs.new-tag }}
        VERSION_OVERRIDE: ${{ inputs.version-override }}
      shell: bash

    - name: Version bump
      run: |
        # Bump version = <number> in version file
        sed -i "s/^__version__ = .*/__version__ = \"${NEW_TAG}\"/" "$VERSION_FILE_PATH"
        git add "$VERSION_FILE_PATH"
        git commit -m "Automatic version bump to ${NEW_TAG}"
        git push origin "$MAIN_BRANCH"
      env:
        NEW_TAG: ${{ steps.tag_resolution.outputs.new_tag }}
        VERSION_FILE_PATH: ${{ inputs.version-file-path }}
        MAIN_BRANCH: ${{ inputs.main-branch }}
      shell: bash
        
    - name: Publish tag on github
      run: |
        git tag "$NEW_TAG"
        git push origin "$NEW_TAG"
      env:
        NEW_TAG: ${{ steps.tag_resolution.outputs.new_tag }}
      shell: bash

    - name: Release on github
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ steps.tag_resolution.outputs.new_tag }}
        generate_release_notes: true
        prerelease: ${{ inputs.pre-release-tag != '' }}

    - name: Publish to pypi
      run: |
        python3 -m build
        python3 -m twine upload dist/*
      env:
        TWINE_USERNAME: ${{ inputs.pypi-username }}
        TWINE_PASSWORD: ${{ inputs.pypi-password }}
      shell: bash
